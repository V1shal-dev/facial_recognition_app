name: facial_recognition_appp
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Camera
  camera: ^0.10.5+5
  image_picker: ^1.0.4

  # Face Detection
  google_mlkit_face_detection: ^0.10.0

  # Local Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # Date formatting
  intl: ^0.18.1

  # UI Enhancements
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_launcher_icons: ^0.13.1
  image: ^4.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"  # Your logo here (1024x1024)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/background.jpg
